name: 🔍 Username Scan

on:
  workflow_dispatch:
    inputs:
      username:
        description: "Username to search"
        required: true
        type: string
      no_nsfw:
        description: "Skip NSFW sites"
        required: false
        default: true
        type: boolean

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install openpyxl

      - name: Run scan
        run: |
          FLAGS="--username ${{ inputs.username }} --json --csv"
          if [ "${{ inputs.no_nsfw }}" = "true" ]; then
            FLAGS="$FLAGS --no-nsfw"
          fi
          python blackbird.py $FLAGS || true

      - name: Show results
        run: find results/ -type f 2>/dev/null || echo "No results"

      - name: Convert to Excel
        run: |
          python << 'PYEOF'
          import glob, json, csv, os
          try:
              import openpyxl
          except:
              print("openpyxl missing"); exit(0)

          created = False

          for f in glob.glob("results/*.csv"):
              wb = openpyxl.Workbook()
              ws = wb.active
              ws.title = "Scan Results"
              with open(f) as c:
                  for row in csv.reader(c):
                      ws.append(row)
              for col in ws.columns:
                  mx = max(len(str(cell.value or "")) for cell in col)
                  ws.column_dimensions[col[0].column_letter].width = min(mx+2, 50)
              for cell in ws[1]:
                  cell.font = openpyxl.styles.Font(bold=True)
              out = f.replace(".csv", ".xlsx")
              wb.save(out)
              print(f"Excel from CSV: {out}")
              created = True

          if not created:
              for f in glob.glob("results/*.json"):
                  with open(f) as j:
                      data = json.load(j)
                  if not data:
                      continue
                  if isinstance(data, list) and len(data) > 0 and isinstance(data[0], dict):
                      headers = list(data[0].keys())
                      rows = data
                  elif isinstance(data, dict):
                      found = False
                      for v in data.values():
                          if isinstance(v, list) and len(v) > 0 and isinstance(v[0], dict):
                              rows = v
                              headers = list(rows[0].keys())
                              found = True
                              break
                      if not found:
                          headers = list(data.keys())
                          rows = [data]
                  else:
                      continue
                  wb = openpyxl.Workbook()
                  ws = wb.active
                  ws.title = "Scan Results"
                  ws.append(headers)
                  for row in rows:
                      ws.append([str(row.get(h, "")) for h in headers])
                  for col in ws.columns:
                      mx = max(len(str(cell.value or "")) for cell in col)
                      ws.column_dimensions[col[0].column_letter].width = min(mx+2, 50)
                  for cell in ws[1]:
                      cell.font = openpyxl.styles.Font(bold=True)
                  out = f.replace(".json", ".xlsx")
                  wb.save(out)
                  print(f"Excel from JSON: {out}")
          PYEOF

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ inputs.username }}-${{ github.run_number }}
          path: results/
          retention-days: 30
          if-no-files-found: warn
